####### Global Parameters #########

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no

udp_workers=4

socket=udp:0.0.0.0:5060

advertised_address=192.168.1.25
advertised_port=5060

####### Modules Section ########

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "proto_udp.so"

loadmodule "db_mysql.so"
loadmodule "acc.so"
loadmodule "dialog.so"

####### Module Parameters #########

modparam("rr", "append_fromtag", 0)

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)

modparam("acc", "db_url", "mysql://opensips:opensips@mysql-db/opensips_db")
modparam("acc", "early_media", 0)
modparam("acc", "report_cancels", 1)
modparam("acc", "detect_direction", 0)

modparam("dialog", "db_url", "mysql://opensips:opensips@mysql-db/opensips_db")
modparam("dialog", "db_mode", 1)

####### Routing Logic #########

route {

    xlog("L_INFO", "Recebido $rm de $si:$sp para $ru\n");

    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        xlog("L_INFO", "Mensagem dentro do dialogo: $rm de $si:$sp para $ru\n");

        if (loose_route()) {
            route(relay);
            exit;
        }

        if (is_method("ACK")) {
            route(relay);
            exit;
        }

        send_reply(404, "Not Found");
        exit;
    }

    if (is_method("CANCEL")) {
        route(relay);
        exit;
    }

    if (is_method("INVITE")) {
        record_route();

        create_dialog();

        do_accounting("db");

        $du = "sip:192.168.1.45:5060";

        xlog("L_INFO", "Encaminhando chamada para Asterisk VM2: $du\n");

        route(relay);
        exit;
    }

    if (is_method("OPTIONS")) {
        send_reply(200, "OK");
        exit;
    }

    send_reply(405, "Method Not Allowed");
    exit;
}

route[relay] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

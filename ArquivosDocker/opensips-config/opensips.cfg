####### Global Parameters #########

log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=4

socket=udp:0.0.0.0:5060

####### Modules Section ########

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "proto_udp.so"

loadmodule "db_mysql.so"
loadmodule "acc.so"
loadmodule "dialog.so"

####### Module Parameters #########

modparam("rr", "append_fromtag", 0)

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 30)

modparam("acc", "db_url",
"mysql://opensips:opensips@mysql-db/opensips_db")

modparam("dialog", "db_url",
"mysql://opensips:opensips@mysql-db/opensips_db")
modparam("dialog", "db_mode", 1)
modparam("dialog", "db_update_period", 1)

####### Routing Logic ########

route {

        xlog("L_INFO", "SIP recebido: metodo=$rm origem=$si:$sp destino=$ru callid=$ci\n");

        if (!mf_process_maxfwd_header(10)) {
                send_reply(483, "Too Many Hops");
                exit;
        }

        # Requisições dentro de diálogo: ACK/BYE
        if (has_totag()) {

                if (is_method("ACK")) {
                        xlog("L_INFO", "ACK dentro do dialog Call-ID=$ci\n");
                        exit;
                }

                if (is_method("BYE")) {
                        xlog("L_INFO", "BYE recebido dentro do dialog Call-ID=$ci\n");

                        if (match_dialog()) {
                                xlog("L_INFO", "Dialog encontrado no BYE Call-ID=$ci\n");
                        } else {
                                xlog("L_ERR", "Dialog NAO encontrado no BYE Call-ID=$ci\n");
                        }

                        acc_db_request("SIPp BYE", "acc");

                        send_reply(200, "OK");
                        exit;
                }

                if (!loose_route()) {
                        xlog("L_ERR", "Requisicao sequencial sem Route Call-ID=$ci\n");
                        send_reply(404, "Not here");
                        exit;
                }

                send_reply(200, "OK");
                exit;
        }

        # Primeira requisição da chamada
        if (is_method("INVITE")) {
                xlog("L_INFO", "INVITE recebido de $fu para $tu Call-ID=$ci\n");

                record_route();

                if (!create_dialog()) {
                        xlog("L_ERR", "ERRO ao criar dialog Call-ID=$ci\n");
                } else {
                        xlog("L_INFO", "DIALOG criado Call-ID=$ci\n");
                }

                acc_db_request("SIPp INVITE", "acc");

                send_reply(200, "OK");
                exit;
        }

        if (is_method("OPTIONS")) {
                send_reply(200, "OK");
                exit;
        }

        send_reply(404, "Not Found");
}
